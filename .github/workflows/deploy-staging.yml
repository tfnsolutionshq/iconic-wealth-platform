name: Build & Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # STEP 1: Verify the GitHub secret
      - name: Verify API environment variable
        run: |
          if [ "$VITE_API_BASE_URL" = "https://api.iconicwealth.tfnsolutions.us/api/v1/" ]; then
            echo "API URL is correctly configured."
          else
            echo "API URL is incorrect or empty."
          fi
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Build Vite project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # STEP 3: Inspect generated production build
      - name: Inspect production build
        run: |
          echo "Checking generated build..."

          if grep -R -Fq 'https://api.iconicwealth.tfnsolutions.us/api/v1/' dist/; then
            echo "FOUND: Correct API URL (with api. subdomain)"
          else
            echo "NOT FOUND: Correct API URL"
          fi

          if grep -R -Fq 'https://iconicwealth.tfnsolutions.us/api/v1/' dist/; then
            echo "FOUND: Incorrect API URL (without api. subdomain)"
          else
            echo "NOT FOUND: Incorrect API URL"
          fi

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -avz --delete --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            dist/ \
            tfnsolutions@${{ secrets.SSH_HOST }}:/home/tfnsolutions/iconicwealthhub.tfnsolutions.us/
